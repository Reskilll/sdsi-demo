name: URL Shortener CI

on:
  push:
    branches: [main, kunal-p1]
    paths:
      - 'submissions/kunal-p1/url-shortener/**'
      - '.github/workflows/url-shortener-ci.yml'
  pull_request:
    paths:
      - 'submissions/kunal-p1/url-shortener/**'
      - '.github/workflows/url-shortener-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: submissions/kunal-p1/url-shortener

jobs:
  verify:
    name: typecheck · lint · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: submissions/kunal-p1/url-shortener/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests with coverage
        run: npm run test:cov

      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: submissions/kunal-p1/url-shortener/coverage
          retention-days: 7

  smoke:
    name: build · boot · smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: submissions/kunal-p1/url-shortener/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Boot and exercise the API
        env:
          PORT: '3000'
          HOST: '127.0.0.1'
          BASE_URL: 'http://127.0.0.1:3000'
          DATABASE_PATH: './data/ci.db'
          API_KEYS: 'ci-key'
          IP_SALT: 'ci-salt-not-a-real-secret'
          LOG_LEVEL: 'warn'
        run: |
          node dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 0.5
          done

          echo "--- shorten ---"
          SHORTEN=$(curl -fsS -X POST http://127.0.0.1:3000/shorten \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-key' \
            -d '{"url":"https://example.com/ci-smoke"}')
          echo "$SHORTEN"
          CODE=$(echo "$SHORTEN" | sed -E 's/.*"code":"([^"]+)".*/\1/')

          echo "--- duplicate returns 200 with the same code ---"
          DUPLICATE=$(curl -fsS -X POST http://127.0.0.1:3000/shorten \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-key' \
            -d '{"url":"https://example.com/ci-smoke"}')
          echo "$DUPLICATE"
          echo "$DUPLICATE" | grep -q "\"code\":\"$CODE\""

          echo "--- redirect is 302 ---"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/$CODE")
          test "$STATUS" = "302"

          echo "--- stats show one click ---"
          curl -fsS "http://127.0.0.1:3000/stats/$CODE" | tee /tmp/stats.json
          grep -q '"totalClicks":1' /tmp/stats.json

          echo "--- javascript: scheme is rejected ---"
          BAD=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/shorten \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-key' \
            -d '{"url":"javascript:alert(1)"}')
          test "$BAD" = "400"

          echo "--- unknown code is 404 ---"
          MISSING=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/zzzzzzz)
          test "$MISSING" = "404"

          kill -TERM $SERVER_PID
          wait $SERVER_PID || true
