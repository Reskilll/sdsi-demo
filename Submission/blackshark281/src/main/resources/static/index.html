<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        :root {
            --bg: #ffffff;
            --card-bg: #f8f9fa;
            --text: #212529;
            --text-secondary: #6c757d;
            --border: #dee2e6;
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --danger: #dc3545;
            --success: #198754;
            --warning: #ffc107;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e;
                --card-bg: #16213e;
                --text: #e0e0e0;
                --text-secondary: #adb5bd;
                --border: #2d3748;
                --primary: #4dabf7;
                --primary-hover: #339af0;
                --shadow: 0 2px 8px rgba(0,0,0,0.3);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        .container { max-width: 640px; width: 100%; }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--primary);
        }
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--text);
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .result {
            margin-top: 16px;
            padding: 14px;
            background: var(--bg);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .result .url { font-weight: 600; word-break: break-all; color: var(--primary); }
        .result .code { font-family: monospace; font-size: 0.9rem; margin-top: 4px; color: var(--text-secondary); }
        .result .copy-btn {
            margin-top: 8px;
            padding: 6px 14px;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            width: auto;
        }
        .result .copy-btn:hover { background: var(--primary); color: #fff; }

        .stats {
            margin-top: 16px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .stat-label { color: var(--text-secondary); }
        .stat-value { font-weight: 600; }
        .clicks-per-day {
            margin-top: 12px;
        }
        .clicks-per-day table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .clicks-per-day th, .clicks-per-day td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .clicks-per-day th { color: var(--text-secondary); font-weight: 600; }

        .error {
            margin-top: 12px;
            padding: 10px 14px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 6px;
            color: var(--danger);
            font-size: 0.9rem;
        }
        .success {
            margin-top: 12px;
            padding: 10px 14px;
            background: #f0fff4;
            border: 1px solid #c6f6d5;
            border-radius: 6px;
            color: var(--success);
            font-size: 0.9rem;
        }
        @media (prefers-color-scheme: dark) {
            .error { background: #2d1f1f; border-color: #5c2828; }
            .success { background: #1f2d2a; border-color: #285c3c; }
        }
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .tab:first-child { border-radius: 6px 0 0 0; }
        .tab:last-child { border-radius: 0 6px 0 0; }
        .tab.active {
            background: var(--card-bg);
            color: var(--primary);
            border-bottom-color: var(--card-bg);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#128279; URL Shortener</h1>
        <p class="subtitle">Shorten, share, and track your links</p>

        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="showTab('shorten')">Shorten</div>
                <div class="tab" onclick="showTab('stats')">Stats</div>
            </div>

            <!-- Shorten Tab -->
            <div id="tab-shorten" class="tab-content active" style="padding-top: 20px;">
                <form id="shortenForm" onsubmit="handleShorten(event)">
                    <div class="form-group">
                        <label for="url">URL to shorten *</label>
                        <input type="text" id="url" placeholder="https://example.com/your-long-url" required>
                    </div>
                    <div class="form-group">
                        <label for="customAlias">Custom alias (optional)</label>
                        <input type="text" id="customAlias" placeholder="my-link" minlength="4" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label for="expiryDays">Expiry (optional)</label>
                        <select id="expiryDays">
                            <option value="">Never</option>
                            <option value="1">1 day</option>
                            <option value="7">7 days</option>
                            <option value="30">30 days</option>
                            <option value="90">90 days</option>
                            <option value="365">1 year</option>
                        </select>
                    </div>
                    <button type="submit" id="shortenBtn">Shorten</button>
                </form>
                <div id="shortenResult" style="display:none;"></div>
                <div id="shortenError" style="display:none;"></div>
            </div>

            <!-- Stats Tab -->
            <div id="tab-stats" class="tab-content" style="padding-top: 20px;">
                <form onsubmit="handleStats(event)">
                    <div class="form-group">
                        <label for="statsCode">Short code</label>
                        <input type="text" id="statsCode" placeholder="Enter short code" required>
                    </div>
                    <button type="submit" id="statsBtn">Get Stats</button>
                </form>
                <div id="statsResult" style="display:none;"></div>
                <div id="statsError" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function showTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        }

        async function handleShorten(event) {
            event.preventDefault();
            const btn = document.getElementById('shortenBtn');
            const resultDiv = document.getElementById('shortenResult');
            const errorDiv = document.getElementById('shortenError');

            btn.disabled = true;
            btn.textContent = 'Shortening...';
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            const payload = {
                url: document.getElementById('url').value.trim(),
                customAlias: document.getElementById('customAlias').value.trim() || null,
                expiryDays: document.getElementById('expiryDays').value
                    ? parseInt(document.getElementById('expiryDays').value) : null
            };

            try {
                const resp = await fetch(API_BASE + '/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await resp.json();

                if (!resp.ok) {
                    showError(errorDiv, data.message || data.error || 'Failed to shorten URL');
                    return;
                }

                resultDiv.className = 'result';
                resultDiv.innerHTML = `
                    <div class="code">/${data.shortCode}</div>
                    <div class="url" style="margin-top:6px">
                        <a href="${data.shortUrl}" target="_blank" style="color:inherit">${data.shortUrl}</a>
                    </div>
                    <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px">
                        ${data.originalUrl}
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard('${data.shortUrl}', this)">Copy</button>
                `;
                resultDiv.style.display = 'block';
            } catch (err) {
                showError(errorDiv, 'Network error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Shorten';
            }
        }

        async function handleStats(event) {
            event.preventDefault();
            const btn = document.getElementById('statsBtn');
            const resultDiv = document.getElementById('statsResult');
            const errorDiv = document.getElementById('statsError');
            const code = document.getElementById('statsCode').value.trim();

            btn.disabled = true;
            btn.textContent = 'Loading...';
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const resp = await fetch(API_BASE + '/api/stats/' + encodeURIComponent(code));
                const data = await resp.json();

                if (!resp.ok) {
                    showError(errorDiv, data.message || 'Failed to fetch stats');
                    return;
                }

                let clicksPerDayHtml = '';
                if (data.clicksPerDay && Object.keys(data.clicksPerDay).length > 0) {
                    clicksPerDayHtml = '<div class="clicks-per-day"><table><thead><tr><th>Date</th><th>Clicks</th></tr></thead><tbody>';
                    for (const [day, count] of Object.entries(data.clicksPerDay)) {
                        clicksPerDayHtml += `<tr><td>${day}</td><td>${count}</td></tr>`;
                    }
                    clicksPerDayHtml += '</tbody></table></div>';
                }

                resultDiv.className = 'result';
                resultDiv.innerHTML = `
                    <div class="stats">
                        <div class="stat-row">
                            <span class="stat-label">Short Code</span>
                            <span class="stat-value">${data.shortCode}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Original URL</span>
                            <span class="stat-value" style="word-break:break-all;font-size:0.85rem">${data.originalUrl}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Total Clicks</span>
                            <span class="stat-value">${data.totalClicks}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Last Accessed</span>
                            <span class="stat-value">${data.lastAccessedAt || 'Never'}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Created</span>
                            <span class="stat-value">${data.createdAt}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Expires</span>
                            <span class="stat-value">${data.expiresAt || 'Never'}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Status</span>
                            <span class="stat-value">${data.expired ? '&#x274C; Expired' : '&#x2705; Active'}</span>
                        </div>
                    </div>
                    ${clicksPerDayHtml}
                `;
                resultDiv.style.display = 'block';
            } catch (err) {
                showError(errorDiv, 'Network error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Get Stats';
            }
        }

        function showError(el, msg) {
            el.className = 'error';
            el.textContent = msg;
            el.style.display = 'block';
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }
    </script>
</body>
</html>
