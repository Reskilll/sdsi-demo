[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dag-scheduler"
version = "1.0.0"
description = "Job Scheduler with Dependency Resolution (DAG) — mini build/ETL orchestrator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
dag-scheduler = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]