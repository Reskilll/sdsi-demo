[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sla-tracker"
version = "1.0.0"
description = "Business-hours SLA breach tracker for IT service-desk tickets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sla-tracker = "sla_tracker.cli:main"

[tool.setuptools]
packages = ["sla_tracker"]

