[project]
name = "whis24virus-url-shortener"
version = "1.0.0"
description = "SDSI Digithon 2026 - High-Assurance URL Shortener & Telemetry Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
